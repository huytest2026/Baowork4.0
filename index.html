<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý số hóa tuyến cáp</title>
    <style>
        :root { --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; }
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        .form-group input, .form-group select { padding: 8px; border: 1px solid #ced4da; border-radius: 4px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 30px; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; color: #fff; font-weight: bold; }
        .btn-add { background-color: var(--success-color); }
        .btn-update { background-color: var(--warning-color); color: #000; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #dee2e6; padding: 8px; text-align: left; }
        th { background-color: #ffc107; }
    </style>
</head>
<body>

<div class="container">
    <h2>QUẢN LÝ SỐ HÓA TUYẾN CÁP</h2>
    <form id="cableForm">
        <input type="hidden" id="rowIndex" value="">
        <div class="form-grid">
            <div class="form-group"><label>Trạm quản lý</label><input type="text" id="tramQuanLy"></div>
            <div class="form-group"><label>Tên tuyến quy định</label><input type="text" id="tenTuyenQuyDinh"></div>
            <div class="form-group"><label>Link</label><input type="text" id="link"></div>
            <div class="form-group"><label>Tuyến cáp</label><input type="text" id="tuyenCap"></div>
            <div class="form-group"><label>Đối tượng</label><input type="text" id="doiTuong"></div>
            <div class="form-group"><label>Chiều dài Link (Km)</label><input type="number" step="0.1" id="chieuDaiLink"></div>
            <div class="form-group"><label>OTDR -> MX</label><input type="number" step="0.01" id="otdrMx"></div>
            <div class="form-group"><label>Độ sâu/Cao</label><input type="number" id="doSau"></div>
            <div class="form-group"><label>Lấy tọa độ</label><input type="text" id="layToaDo"></div>
            <div class="form-group"><label>Thời gian</label><input type="date" id="thoiGian"></div>
            <div class="form-group"><label>Chiều từ</label><select id="chieuTu"><option value="Bắc-> Nam">Bắc-> Nam</option><option value="Nam-> Bắc">Nam-> Bắc</option></select></div>
            <div class="form-group"><label>Diễn giải</label><input type="text" id="dienGiai"></div>
            <div class="form-group"><label>Tại Km</label><input type="text" id="taiKm"></div>
        </div>
        <div class="btn-group">
            <button type="button" class="btn-add" id="btnAdd" onclick="addRecord()">Nút Thêm số liệu</button>
            <button type="button" class="btn-update" id="btnUpdate" onclick="updateRecord()" style="display:none;">Nút Cập nhật</button>
        </div>
    </form>

    <h3>Danh sách số liệu</h3>
    <table id="dataTable">
        <thead>
            <tr><th>STT</th><th>Trạm</th><th>Link</th><th>Tuyến</th><th>Đối tượng</th><th>Tên tuyến</th><th>Chiều dài</th><th>OTDR</th><th>Tọa độ</th><th>Tại Km</th><th>Thời gian</th><th>Chiều</th><th>Diễn giải</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnSMSXVWjJz3kSIjakz-uhZpk63SubmgOpTEiLZMQn-uXwkOmS1Z7ZrAN8mGYUjHWx0w/exec";

    function getFormData() {
        return {
            tramQuanLy: document.getElementById('tramQuanLy').value,
            link: document.getElementById('link').value,
            tuyenCap: document.getElementById('tuyenCap').value,
            doiTuong: document.getElementById('doiTuong').value, // Trường mới
            tenTuyenQuyDinh: document.getElementById('tenTuyenQuyDinh').value,
            chieuDaiLink: document.getElementById('chieuDaiLink').value,
            otdrMx: document.getElementById('otdrMx').value,
            doSau: document.getElementById('doSau').value,
            layToaDo: document.getElementById('layToaDo').value,
            taiKm: document.getElementById('taiKm').value,
            thoiGian: document.getElementById('thoiGian').value,
            chieuTu: document.getElementById('chieuTu').value,
            dienGiai: document.getElementById('dienGiai').value
        };
    }

    async function addRecord() {
        const data = getFormData();
        const btn = document.getElementById('btnAdd');
        btn.innerText = "Đang gửi...";
        btn.disabled = true;

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            alert('Đã gửi dữ liệu lên Google Sheets!');
            location.reload(); // Tải lại trang để cập nhật bảng
        } catch (error) { alert('Lỗi: ' + error); }
        finally { btn.innerText = "Nút Thêm số liệu"; btn.disabled = false; }
    }
</script>
</body>
</html>
