<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý số hóa tuyến cáp</title>
    <!-- Thư viện bản đồ Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --success-color: #198754; --warning-color: #ffc107; }
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        .form-group input, .form-group select { padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; }
        .input-with-btn { display: flex; gap: 5px; }
        .input-with-btn input { flex: 1; }
        .input-with-btn button { padding: 0 10px; background-color: #0d6efd; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button.main-btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; color: #fff; font-weight: bold; }
        .btn-add { background-color: var(--success-color); }
        .camera-box { display: flex; align-items: center; gap: 10px; }
        #map { height: 450px; width: 100%; border-radius: 8px; border: 1px solid #ced4da; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th, td { border: 1px solid #dee2e6; padding: 8px; text-align: left; white-space: nowrap; }
        th { background-color: #ffc107; }
    </style>
</head>
<body>

<div class="container">
    <h2>QUẢN LÝ SỐ HÓA TUYẾN CÁP</h2>
    <form id="cableForm">
        <div class="form-grid">
            <!-- 1. Trạm quản lý -->
            <div class="form-group">
                <label>1. Trạm quản lý</label>
                <select id="tramQuanLy" onchange="updateLinkDropdown()"></select>
            </div>
            <!-- 2. Link -->
            <div class="form-group">
                <label>2. Link</label>
                <select id="link" onchange="updateTuyenDropdown()"></select>
            </div>
            <!-- 3. Tuyến cáp -->
            <div class="form-group">
                <label>3. Tuyến cáp</label>
                <select id="tuyenCap" onchange="updateDetails()"></select>
            </div>
            <!-- 4. Tên tuyến quy định -->
            <div class="form-group">
                <label>4. Tên tuyến quy định</label>
                <input type="text" id="tenTuyenQuyDinh" readonly style="background-color: #e9ecef;">
            </div>
            <div class="form-group">
                <label>Chiều dài Link (Km)</label>
                <input type="number" step="0.1" id="chieuDaiLink" readonly style="background-color: #e9ecef;">
            </div>
            <div class="form-group">
                <label>Đối tượng</label>
                <input type="text" id="doiTuong" value="MX">
            </div>
            <div class="form-group">
                <label>Phương thức thi công</label>
                <select id="phuongThucThiCong">
                    <option value="Chôn trực tiếp">Chôn trực tiếp</option>
                    <option value="Đường ống nhựa">Đường ống nhựa</option>
                    <option value="Treo cột">Treo cột</option>
                </select>
            </div>
            <div class="form-group">
                <label>OTDR -> MX</label>
                <input type="number" step="0.01" id="otdrMx" placeholder="53.45">
            </div>
            <div class="form-group">
                <label>Độ sâu/Cao cáp</label>
                <input type="number" id="doSau" placeholder="70">
            </div>
            <div class="form-group">
                <label>Lấy tọa độ</label>
                <div class="input-with-btn">
                    <input type="text" id="layToaDo" placeholder="16.4802,107.6233">
                    <button type="button" onclick="getLocation()" title="Định vị GPS thực tế">📍 GPS</button>
                </div>
            </div>
            <div class="form-group">
                <label>Thời gian</label>
                <input type="date" id="thoiGian">
            </div>
            <div class="form-group">
                <label>Chiều từ</label>
                <select id="chieuTu">
                    <option value="Bắc-> Nam">Bắc-> Nam</option>
                    <option value="Nam-> Bắc">Nam-> Bắc</option>
                </select>
            </div>
            <div class="form-group">
                <label>Diễn giải</label>
                <input type="text" id="dienGiai" placeholder="Điểm chuyển trái-> Phải">
            </div>
            <div class="form-group">
                <label>Km</label>
                <input type="number" id="km" placeholder="876" oninput="calculateTaiKm()">
            </div>
            <div class="form-group">
                <label>M</label>
                <input type="number" id="m" placeholder="230" oninput="calculateTaiKm()">
            </div>
            <!-- Chụp ảnh trực tiếp bằng camera -->
            <div class="form-group">
                <label>Chụp ảnh</label>
                <div class="camera-box">
                    <input type="file" id="chupAnh" accept="image/*" capture="environment" style="display:none;" onchange="previewImage(this)">
                    <button type="button" onclick="document.getElementById('chupAnh').click()" style="padding: 8px 15px; background: #6c757d; color: #fff; border: none; border-radius: 4px; cursor: pointer;">📷 Mở Camera chụp</button>
                    <span id="imgStatus" style="font-size: 12px; color: #666;">Chưa có ảnh</span>
                </div>
            </div>
            <div class="form-group">
                <label>Tại Km (Tự động)</label>
                <input type="text" id="taiKm" readonly style="background-color: #e9ecef;" placeholder="Km 876+230">
            </div>
            <div class="form-group">
                <label>Tuyến đường</label>
                <input type="text" id="tuyenDuong" value="QL1A">
            </div>
            <div class="form-group">
                <label>Cách mép đường (m)</label>
                <input type="number" step="0.1" id="cachMepDuong" placeholder="2">
            </div>
        </div>

        <div class="btn-group">
            <button type="button" class="main-btn btn-add" id="btnAdd" onclick="addRecord()">Nút Thêm số liệu số hóa</button>
        </div>
    </form>

    <h3>Bản đồ hiển thị các điểm cập nhật</h3>
    <div id="map"></div>

    <h3>Danh sách số liệu</h3>
    <div style="overflow-x: auto;">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>ID</th><th>Trạm quản lý</th><th>Tên tuyến quy định</th><th>Link</th><th>Tuyến cáp</th><th>Chiều dài Link</th><th>Đối tượng</th><th>Phương thức thi công</th><th>OTDR->MX</th><th>Độ sâu/Cao</th><th>Lấy tọa độ</th><th>Thời gian</th><th>Chiều từ</th><th>Diễn giải</th><th>Km</th><th>M</th><th>Chụp ảnh</th><th>Tại Km</th><th>Tuyến đường</th><th>Cách mép đường(m)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- Thư viện bản đồ Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // DÁN LINK WEB APP CỦA BẠN VÀO ĐÂY
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwMNvBV14-8NnIhfjFAI0fxhgxVYqabj9VB7WU8hpqVtf60OTRggX0zM4y95kxljLGHg/exec";

    const libraryData = [
        { tram: "HUE", link: "HUE-DNG", tuyen: "24FO", tenTuyen: "24FO HUE-ĐNG.01", chieuDai: 90 },
        { tram: "HUE", link: "HUE-DNG", tuyen: "96FO", tenTuyen: "96FO HUE-ĐNG.01", chieuDai: 89.7 },
        { tram: "HUE", link: "HUE-DNG", tuyen: "48FO", tenTuyen: "48FO HUE-ĐNG.01", chieuDai: 80.8 },
        { tram: "HUE", link: "HUE-DNG", tuyen: "8FO", tenTuyen: "08FO HUE-ĐNG.01", chieuDai: 88.7 },
        { tram: "ALI", link: "ALI-HIN", tuyen: "24FO", tenTuyen: "24FO ALI-HIEN.01", chieuDai: 120.3 }
    ];

    let map;
    let markersLayer;

    window.onload = function() {
        document.getElementById('thoiGian').valueAsDate = new Date();
        initDropdowns();
        initMap();
        loadDataFromSheet();
    };

    function initMap() {
        map = L.map('map').setView([16.4637, 107.5909], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
        markersLayer = L.layerGroup().addTo(map);
    }

    function initDropdowns() {
        const tramSet = [...new Set(libraryData.map(item => item.tram))];
        const tramSelect = document.getElementById('tramQuanLy');
        tramSelect.innerHTML = '';
        tramSet.forEach(tram => {
            tramSelect.innerHTML += `<option value="${tram}">${tram}</option>`;
        });
        updateLinkDropdown();
    }

    function updateLinkDropdown() {
        const tram = document.getElementById('tramQuanLy').value;
        const links = [...new Set(libraryData.filter(i => i.tram === tram).map(i => i.link))];
        const linkSelect = document.getElementById('link');
        linkSelect.innerHTML = '';
        links.forEach(l => linkSelect.innerHTML += `<option value="${l}">${l}</option>`);
        updateTuyenDropdown();
    }

    function updateTuyenDropdown() {
        const tram = document.getElementById('tramQuanLy').value;
        const link = document.getElementById('link').value;
        const tuyens = libraryData.filter(i => i.tram === tram && i.link === link);
        const tuyenSelect = document.getElementById('tuyenCap');
        tuyenSelect.innerHTML = '';
        tuyens.forEach(t => tuyenSelect.innerHTML += `<option value="${t.tuyen}">${t.tuyen}</option>`);
        updateDetails();
    }

    function updateDetails() {
        const tram = document.getElementById('tramQuanLy').value;
        const link = document.getElementById('link').value;
        const tuyen = document.getElementById('tuyenCap').value;

        const found = libraryData.find(item => item.tram === tram && item.link === link && item.tuyen === tuyen);
        if (found) {
            document.getElementById('tenTuyenQuyDinh').value = found.tenTuyen;
            document.getElementById('chieuDaiLink').value = found.chieuDai;
        } else {
            document.getElementById('tenTuyenQuyDinh').value = '';
            document.getElementById('chieuDaiLink').value = '';
        }
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            document.getElementById('imgStatus').innerText = "Đã chụp: " + input.files[0].name;
            document.getElementById('imgStatus').style.color = "green";
        }
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);
                    document.getElementById('layToaDo').value = `${lat},${lng}`;
                },
                () => alert('Không thể lấy tọa độ GPS.')
            );
        } else {
            alert('Trình duyệt không hỗ trợ GPS.');
        }
    }

    function calculateTaiKm() {
        const km = document.getElementById('km').value;
        const m = document.getElementById('m').value;
        if (km !== '') {
            document.getElementById('taiKm').value = `Km ${km}${m ? '+' + m : ''}`;
        } else {
            document.getElementById('taiKm').value = '';
        }
    }

    async function loadDataFromSheet() {
        try {
            const response = await fetch(GOOGLE_SCRIPT_URL);
            const data = await response.json();
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            markersLayer.clearLayers();

            data.forEach(row => {
                tbody.innerHTML += `<tr>
                    <td>${row.id || ''}</td>
                    <td>${row.tramQuanLy || ''}</td>
                    <td>${row.tenTuyenQuyDinh || ''}</td>
                    <td>${row.link || ''}</td>
                    <td>${row.tuyenCap || ''}</td>
                    <td>${row.chieuDaiLink || ''}</td>
                    <td>${row.doiTuong || ''}</td>
                    <td>${row.phuongThucThiCong || ''}</td>
                    <td>${row.otdrMx || ''}</td>
                    <td>${row.doSau || ''}</td>
                    <td>${row.layToaDo || ''}</td>
                    <td>${row.thoiGian || ''}</td>
                    <td>${row.chieuTu || ''}</td>
                    <td>${row.dienGiai || ''}</td>
                    <td>${row.km || ''}</td>
                    <td>${row.m || ''}</td>
                    <td>${row.chupAnh || ''}</td>
                    <td>${row.taiKm || ''}</td>
                    <td>${row.tuyenDuong || ''}</td>
                    <td>${row.cachMepDuong || ''}</td>
                </tr>`;

                if (row.layToaDo && row.layToaDo.includes(',')) {
                    const parts = row.layToaDo.split(',');
                    const lat = parseFloat(parts[0]);
                    const lng = parseFloat(parts[1]);
                    if (!isNaN(lat) && !isNaN(lng)) {
                        const labelText = `${row.doiTuong || 'MX'}/${row.taiKm || 'Km 0+000'}`;
                        L.marker([lat, lng]).addTo(markersLayer)
                         .bindTooltip(labelText, { permanent: true, direction: 'top' })
                         .bindPopup(`<b>${labelText}</b><br>Diễn giải: ${row.dienGiai || ''}`);
                    }
                }
            });
        } catch (e) {
            console.log("Chưa tải được dữ liệu từ Google Sheets: ", e);
        }
    }

    async function addRecord() {
        const fileInput = document.getElementById('chupAnh');
        let fotoName = fileInput.files.length > 0 ? fileInput.files[0].name : "";

        const data = {
            tramQuanLy: document.getElementById('tramQuanLy').value,
            tenTuyenQuyDinh: document.getElementById('tenTuyenQuyDinh').value,
            link: document.getElementById('link').value,
            tuyenCap: document.getElementById('tuyenCap').value,
            chieuDaiLink: document.getElementById('chieuDaiLink').value,
            doiTuong: document.getElementById('doiTuong').value,
            phuongThucThiCong: document.getElementById('phuongThucThiCong').value,
            otdrMx: document.getElementById('otdrMx').value,
            doSau: document.getElementById('doSau').value,
            layToaDo: document.getElementById('layToaDo').value,
            thoiGian: document.getElementById('thoiGian').value,
            chieuTu: document.getElementById('chieuTu').value,
            dienGiai: document.getElementById('dienGiai').value,
            km: document.getElementById('km').value,
            m: document.getElementById('m').value,
            chupAnh: fotoName,
            taiKm: document.getElementById('taiKm').value,
            tuyenDuong: document.getElementById('tuyenDuong').value,
            cachMepDuong: document.getElementById('cachMepDuong').value
        };

        const btn = document.getElementById('btnAdd');
        btn.innerText = "Đang gửi...";
        btn.disabled = true;

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            alert('Đã thêm số liệu thành công!');
            location.reload();
        } catch (error) {
            alert('Lỗi: ' + error);
        } finally {
            btn.innerText = "Nút Thêm số liệu số hóa";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
